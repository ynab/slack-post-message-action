name: 'Slack Post Message Action'
description: 'GitHub Action that posts a message to a Slack channel'
inputs:
  token:
    description: "The Slack auth token.  This is only required if environment variable SLACK_BOT_TOKEN is not set."
    required: false
  channel:
    description: "The channel name to post to"
    required: true
  thread_ts:
    description: "The timestamp ID of the parent message to reply to"
    required: false
  text:
    description: "The message text to post"
    required: true
  unfurl_links:
    description: "Whether links in the message should be unfurled"
    type: boolean
    default: true
outputs:
  ts:
    description: "The timestamp ID of the message that was just posted"
    value: ${{steps.slack-post-message.outputs.ts}}
  error:
    description: "The Slack API error code (e.g. channel_not_found) if the post failed"
    value: ${{steps.slack-post-message.outputs.error}}
branding:
  icon: 'tag'
  color: 'blue'
runs:
  using: 'composite'
  steps:
    - name: Validate required inputs
      shell: bash
      env:
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_TEXT: ${{ inputs.text }}
        INPUT_UNFURL_LINKS: ${{ inputs.unfurl_links }}
      run: |
        # ${var@E} below needs bash 4.4+
        (( BASH_VERSINFO[0] > 4 || (BASH_VERSINFO[0] == 4 && BASH_VERSINFO[1] >= 4) )) \
          || { echo "::error::slack-post-message-action requires bash 4.4+ (found $BASH_VERSION)"; exit 1; }
        [[ "$INPUT_CHANNEL" ]] || { echo "required input 'channel' not specified"; exit 1; }
        [[ "$INPUT_TEXT" ]] || { echo "required input 'text' not specified"; exit 1; }
        [[ "$INPUT_UNFURL_LINKS" == true || "$INPUT_UNFURL_LINKS" == false ]] \
          || { echo "::error::input 'unfurl_links' must be true or false (got '$INPUT_UNFURL_LINKS')"; exit 1; }
    - name: POST to chat.postMessage API
      id: slack-post-message
      shell: bash
      env:
        INPUT_TOKEN: ${{ env.SLACK_BOT_TOKEN || inputs.token }}
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_THREAD_TS: ${{ inputs.thread_ts }}
        INPUT_UNFURL_LINKS: ${{ inputs.unfurl_links }}
        INPUT_TEXT: ${{ inputs.text }}
      run: |
        # Interpret backslash escapes (\n, \', \\, ...) the way bash's $'...' quoting
        # does, which keeps the common v1.4 escapes working. (v1.4 also decoded
        # the result again as a JSON string, so e.g. \\n used to become a newline
        # and is now a literal \n.) This never runs commands or expands
        # variables: `...`, $(...) and $VAR stay literal.
        text=${INPUT_TEXT@E}
        payload=$(jq --null-input \
          --arg channel "$INPUT_CHANNEL" \
          --arg thread_ts "$INPUT_THREAD_TS" \
          --argjson unfurl_links "$INPUT_UNFURL_LINKS" \
          --arg text "$text" \
          '{channel: $channel, unfurl_links: $unfurl_links, text: $text}
            + if $thread_ts != "" then {thread_ts: $thread_ts} else {} end')
        # --fail-with-body still writes Slack's response body on an HTTP error (429, 5xx)
        if ! response=$(curl --fail-with-body --silent --show-error \
          --request POST \
          --header "Authorization: Bearer $INPUT_TOKEN" \
          --header "Content-Type: application/json; charset=utf-8" \
          --url https://slack.com/api/chat.postMessage \
          --data "$payload" \
        ); then
          printf 'Slack message API request failed:\n%s\n' "$response"
          exit 1
        fi
        printf 'Slack message API response:\n%s\n' "$response"
        # Slack reports API errors (e.g. channel_not_found) with HTTP 200 and "ok": false
        if [[ $(jq --raw-output '.ok' <<< "$response") != "true" ]]; then
          error=$(jq --raw-output '.error' <<< "$response")
          echo "error=$error" >> "$GITHUB_OUTPUT"
          echo "::error::Slack chat.postMessage failed: $error"
          exit 1
        fi
        ts=$(jq --raw-output '.ts' <<< "$response")
        echo "Setting ts output to $ts"
        echo "ts=$ts" >> "$GITHUB_OUTPUT"
