name: Branch Builder

on:
    pull_request:
      types: [opened, reopened, synchronize]
    push:
      branches: [ main ]
      tags-ignore: "**"
    workflow_dispatch:
      inputs:
        channel_override:
          description: "Optional Slack channel/DM ID to post to instead of the default test channel"
          required: false
env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }} # github.head_ref for pull_request event and github.ref_name for push event
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_TEST_TOKEN }}
  SLACK_CHANNEL_ID: ${{ github.event.inputs.channel_override || secrets.SLACK_TEST_CHANNEL_ID }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test Slack message with default settings
        id: basic-message
        uses: ./
        with:
          channel: ${{ env.SLACK_CHANNEL_ID }}
          text: 'Test message from <https://github.com/${{ github.repository }}|`${{ github.repository }}`>:\n\nMessage sent from: <https://github.com/${{ github.repository }}/compare/main...${{ env.BRANCH_NAME }}|`${{ env.BRANCH_NAME }}`>\nWorkflow Log: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Run ${{ github.run_id }}>'
      - name: Test Slack message with optional inputs specified (reply message + unfurl_links disabled)
        uses: ./
        with:
          channel: ${{ env.SLACK_CHANNEL_ID }}
          thread_ts: ${{ steps.basic-message.outputs.ts }}
          text: 'Test reply with a link to unfurl (that should _not_ unfurl): <https://aus.youneedabudget.com/|YNAB AU Marketing Site>'
          unfurl_links: false
      - name: Test Slack message with various text formatting
        uses: ./
        with:
          channel: ${{ env.SLACK_CHANNEL_ID }}
          thread_ts: ${{ steps.basic-message.outputs.ts }}
          text: "Test various text formatting:\n• Single quotes don't need escaping, and the legacy escaped form still works: won\\'t\n• literal emoji 😀\n• colon-formatted emoji :blob-wave:\n• *bold text*\n• _italicized text_\n• ~strikethrough text~\n• `inline code`\n• Automatically linked text www.ynab.com\n• Link with <http://www.ynab.com|custom text>\n>Block quote\n```Multi-line\ncode```"
          unfurl_links: false
      - name: Test Slack message with multiline text (literal newlines)
        uses: ./
        with:
          channel: ${{ env.SLACK_CHANNEL_ID }}
          thread_ts: ${{ steps.basic-message.outputs.ts }}
          text: |-
            :rocket: *Test multiline message with literal newlines*

            ───────────────────
            :sparkles: *What's in this release:*
            • Fixed transaction image overlay to display above the help widget
            • Mobile apps now show bank institution names and logos
            • Improved mobile app performance when loading budget data
          unfurl_links: false
      - name: Test Slack message with multiline text containing double quotes
        uses: ./
        with:
          channel: ${{ env.SLACK_CHANNEL_ID }}
          thread_ts: ${{ steps.basic-message.outputs.ts }}
          text: |-
            :rocket: *Test multiline with "quoted" text*

            • Fixed a bug where the "assign money" prompt appeared too early
            • Improved the "getting started" onboarding flow
          unfurl_links: false
      - name: Test Slack message with shell and JSON metacharacters
        uses: ./
        with:
          channel: ${{ env.SLACK_CHANNEL_ID }}
          thread_ts: ${{ steps.basic-message.outputs.ts }}
          text: |-
            Shell/JSON metacharacters (should all appear literally, nothing executed):
            • doesn't "load" \ `x` $(id) ${HOME} $GITHUB_SHA
            • a JSON-looking string: {"text": "nope", "ok": false}
            • escaped backslash \\ becomes one backslash
          unfurl_links: false
      - name: Test that a Slack API error fails the step
        id: api-error
        continue-on-error: true
        uses: ./
        with:
          channel: "not-a-real-channel-${{ github.run_id }}"
          text: "This message should never be posted"
      - name: Assert the Slack API error failed the step
        if: steps.api-error.outcome != 'failure' || steps.api-error.outputs.error != 'channel_not_found'
        run: |
          echo "::error::Expected the post to a nonexistent channel to fail with channel_not_found, but its outcome was '${{ steps.api-error.outcome }}' with error '${{ steps.api-error.outputs.error }}'"
          exit 1
